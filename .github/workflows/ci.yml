name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The suite patches config.DASHBOARD_PASSWORD per-test (tests/conftest.py),
      # so no real password is needed. SESSION_SECRET is set only to silence the
      # ephemeral-secret warning that config.py logs when it is absent.
      SESSION_SECRET: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No Playwright browser install: nothing in the automated suite drives a
      # real browser. `integrations/ebay_browser.py` is exercised through mocks,
      # and the live flows live in the scratch_*.py smoke scripts, which are
      # manual by design (they need a logged-in eBay session).
      - name: Run tests
        run: python -m pytest -q
